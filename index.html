<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Frita Follow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--blue:#14306B;--blue2:#1E4FA3;--orange:#F7941D;--green:#12B76A;--red:#E5484D;--card:#ffffff;--muted:#6B7590}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
:root{color-scheme:dark}
html{background:#14306B}
body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:linear-gradient(165deg,var(--blue2),var(--blue) 55%,#0E2350);background-color:#14306B;color:#14213D;min-height:100vh;padding-block:16px 28px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));direction:rtl}
.wrap{max-width:440px;margin:0 auto}
.logo{display:block;margin:4px auto 10px;height:58px;background:#fff;border-radius:12px;padding:4px 10px}
h1{color:#fff;text-align:center;font-size:23px;font-weight:900;line-height:1.45}
.sub{color:#D9E2F5;text-align:center;font-size:14.5px;margin-top:4px;line-height:1.6}
.prog{background:rgba(255,255,255,.18);border-radius:99px;height:12px;margin:16px 0 6px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--orange);border-radius:99px;transition:width .4s}
.ptxt{color:#fff;text-align:center;font-weight:800;font-size:14px}
.list{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.btn{text-decoration:none;display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:14px;border:3px solid transparent;cursor:pointer;width:100%;text-align:right;font:inherit;color:inherit}
.btn .ic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 46px}
.btn .ic svg{width:26px;height:26px;fill:#fff}
.btn .tx{flex:1}
.btn .tx b{display:block;font-size:17px;font-weight:900;color:var(--blue)}
.btn .tx span{font-size:13px;color:var(--muted)}
.btn .st{font-size:13px;font-weight:800;padding:6px 10px;border-radius:99px;background:#FDECEC;color:var(--red);white-space:nowrap}
.btn.done{border-color:var(--green)}
.btn.done .st{background:#E7F8EF;color:var(--green)}
.btn.wait .st{background:#FFF3E0;color:#B45309}
.left{margin-top:14px;background:#FFF6EA;border-radius:14px;padding:12px 14px;font-size:14.5px;font-weight:700;color:#7A4A0E;line-height:1.7;text-align:center}
.toast{position:fixed;left:max(16px, env(safe-area-inset-left, 0px));right:max(16px, env(safe-area-inset-right, 0px));bottom:calc(18px + env(safe-area-inset-bottom, 0px));max-width:440px;margin:0 auto;background:#111827;color:#fff;border-radius:14px;padding:13px 14px;font-size:14.5px;font-weight:700;text-align:center;opacity:0;transform:translateY(20px);transition:.3s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:none}
/* success */
#ok{display:none;position:fixed;inset:0;padding-top:calc(24px + env(safe-area-inset-top, 0px)) !important;background:linear-gradient(160deg,#16C47F,#0E9F6E);color:#fff;text-align:center;padding:24px 16px;z-index:5;overflow:auto}
#ok .big{font-size:84px;line-height:1;margin-top:18px;animation:pop 1.2s ease-in-out infinite}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
#ok h2{font-size:26px;font-weight:900;margin-top:12px;line-height:1.45}
#ok p{font-size:16px;margin-top:6px;opacity:.95}
.live{margin:18px auto 0;max-width:320px;background:rgba(255,255,255,.16);border-radius:18px;padding:14px}
.live .clock{font-size:40px;font-weight:900;direction:ltr;letter-spacing:1px;font-variant-numeric:tabular-nums}
.live .code{font-size:15px;margin-top:2px}
.live .code b{font-size:22px;letter-spacing:3px;direction:ltr;display:inline-block}
.bar{height:8px;border-radius:99px;margin-top:10px;background:linear-gradient(90deg,#fff 0 20%,transparent 20%);background-size:200% 100%;animation:run 1.4s linear infinite;opacity:.85}
@keyframes run{from{background-position:100% 0}to{background-position:-100% 0}}
.staff.arm{background:#FFF3E0;color:#B45309}
.staff:focus-visible,.btn:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.staff{margin-top:22px;background:#fff;color:#0E9F6E;border:none;border-radius:14px;padding:14px 18px;font:inherit;font-size:16px;font-weight:900;width:100%;max-width:320px}
.hint{font-size:12.5px;opacity:.85;margin-top:8px}
#ok.claimed{background:linear-gradient(160deg,#4B5563,#1F2937)}
#ok.claimed .staff{display:none}
</style>

  <h1>تابع Frita<br>واستلم علبتك مجانًا 🎁</h1>
  <p class="sub">4 ضغطات بس 👇 دوس، اعمل <b>فولو</b>، وارجع هنا</p>
  <div class="prog"><i id="pbar"></i></div>
  <div class="ptxt" id="ptxt">0 من 4</div>
  <div class="list" id="list"></div>
  <div class="left" id="left"></div>
</div>

<div id="ok">
  <div class="big">✅</div>
  <h2>تم عمل فولو لجميع المنصات</h2>
  <p>ورّي الشاشة دي للمنظم واستلم علبتك 🎁</p>
  <div class="live">
    <div class="clock" id="clock">--:--:--</div>
    <div class="code">كود: <b id="code">----</b></div>
    <div class="bar"></div>
  </div>
  <button class="staff" id="staff">للمنظم: تم تسليم العلبة</button>
  <div class="hint" id="hint">الساعة لازم تكون شغالة، السكرين شوت مش مقبول</div>
</div>

<div class="toast" id="toast"></div>

<script>
const P = [
  {id:'ig', name:'Instagram', ar:'إنستجرام', url:'https://www.instagram.com/frita.chips.fries/', bg:'linear-gradient(45deg,#F58529,#DD2A7B,#8134AF)',
   svg:'<svg viewBox="0 0 24 24"><path d="M12 7a5 5 0 100 10 5 5 0 000-10zm0 8.2a3.2 3.2 0 110-6.4 3.2 3.2 0 010 6.4zM17.3 5.5a1.2 1.2 0 100 2.4 1.2 1.2 0 000-2.4zM12 2.2c-2.7 0-3 0-4 .1-3.6.2-5.5 2-5.7 5.7-.1 1-.1 1.4-.1 4s0 3 .1 4c.2 3.6 2 5.5 5.7 5.7 1 .1 1.4.1 4 .1s3 0 4-.1c3.6-.2 5.5-2 5.7-5.7.1-1 .1-1.4.1-4s0-3-.1-4c-.2-3.6-2-5.5-5.7-5.7-1-.1-1.3-.1-4-.1zm0 1.8c2.6 0 2.9 0 4 .1 2.7.1 3.9 1.4 4 4 .1 1 .1 1.3.1 3.9s0 2.9-.1 3.9c-.1 2.6-1.4 3.9-4 4-1 .1-1.4.1-4 .1s-2.9 0-3.9-.1c-2.7-.1-3.9-1.4-4-4-.1-1-.1-1.3-.1-3.9s0-2.9.1-3.9c.1-2.7 1.4-3.9 4-4 1-.1 1.3-.1 3.9-.1z"/></svg>'},
  {id:'fb', name:'Facebook', ar:'فيسبوك', url:'https://www.facebook.com/Frita.Chips.Fries', bg:'#1877F2',
   svg:'<svg viewBox="0 0 24 24"><path d="M14 8h3V4h-3c-2.8 0-4.5 1.7-4.5 4.6V11H7v4h2.5v9h4v-9h3l.5-4h-3.5V8.8c0-.5.3-.8.5-.8z"/></svg>'},
  {id:'tt', name:'TikTok', ar:'تيك توك', url:'https://www.tiktok.com/@frita_chips_fries', bg:'#111',
   svg:'<svg viewBox="0 0 24 24"><path d="M16.6 2h-3.4v13.4a2.9 2.9 0 11-2.9-2.9c.3 0 .6 0 .9.1V9.1a6.4 6.4 0 106 6.3V8.7a8 8 0 004.6 1.5V6.8a4.6 4.6 0 01-4.6-4.6z"/></svg>'},
  {id:'yt', name:'YouTube', ar:'يوتيوب', url:'https://www.youtube.com/@fritachipsfries', bg:'#FF0000',
   svg:'<svg viewBox="0 0 24 24"><path d="M23 7.2a3 3 0 00-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 001 7.2 31 31 0 00.5 12a31 31 0 00.5 4.8 3 3 0 002.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 002.1-2.1 31 31 0 00.5-4.8 31 31 0 00-.5-4.8zM9.7 15.1V8.9l5.8 3.1-5.8 3.1z"/></svg>'}
];
const MIN_AWAY = 1500;   // يكفي ثانية ونص بره الصفحة
const TOTAL_WAIT = 2500;   // أو ثانيتين ونص من لحظة الضغط على المنصة
const KEY = 'frita_follow_v1';
let S = {done:{}, code:null, claimed:false, pending:null};
try{ const s = JSON.parse(localStorage.getItem(KEY)||'null'); if(s) S = Object.assign(S,s);}catch(e){}
const save = ()=>{ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };

const $ = id => document.getElementById(id);
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('show'),2800); }

function render(){
  const list = $('list'); list.innerHTML='';
  let n=0;
  P.forEach(p=>{
    const d = !!S.done[p.id]; if(d) n++;
    const w = S.pending && S.pending.id===p.id && !d;
    const b = document.createElement('a');
    b.href = p.url; b.target = '_blank'; b.rel = 'noopener';
    b.className = 'btn' + (d?' done':'') + (w?' wait':'');
    b.innerHTML = `<div class="ic" style="background:${p.bg}">${p.svg}</div>
      <div class="tx"><b>${p.ar}</b><span>${d?'تم الفولو':'دوس واعمل فولو'}</span></div>
      <div class="st">${d?'تم ✅':(w?'ارجع هنا ⏳':'لم يتم ❌')}</div>`;
    b.onclick = (e)=>go(p,e);
    list.appendChild(b);
  });
  $('pbar').style.width = (n/P.length*100)+'%';
  $('ptxt').textContent = `${n} من ${P.length}`;
  const left = P.filter(p=>!S.done[p.id]).map(p=>p.ar);
  $('left').style.display = left.length? 'block':'none';
  $('left').innerHTML = left.length ? `باقي ${left.length===1?'منصة':'منصات'}: <b>${left.join('، ')}</b><br>لم يتم عمل فولو لسه` : '';
  if(n===P.length) showOk();
}

function go(p,e){
  if(S.done[p.id]) { e.preventDefault(); toast(`${p.ar} متسجّلة خلاص ✅`); return; }
  S.pending = {id:p.id, t:Date.now(), awayAt:null}; save();
  setTimeout(render, 50);
}

function markAway(){
  if(S.pending && !S.pending.awayAt){ S.pending.awayAt = Date.now(); save(); }
}
function tryComplete(){
  const pd = S.pending; if(!pd) return;
  const p = P.find(x=>x.id===pd.id); if(!p){ S.pending=null; save(); return; }
  const now = Date.now();
  const ok = (now - pd.t >= TOTAL_WAIT) || (pd.awayAt && now - pd.awayAt >= MIN_AWAY);
  if(ok){
    S.done[p.id] = true; S.pending = null; save(); render();
    const left = P.filter(x=>!S.done[x.id]);
    toast(left.length? `تم ${p.ar} ✅ باقي ${left.length}` : 'تمام! خلصت كل المنصات 🎉');
  } else if(pd.awayAt){
    S.pending = null; save(); render();
    toast(`رجعت بسرعة! افتح ${p.ar} تاني واعمل فولو`);
  }
}
document.addEventListener('visibilitychange', ()=>{ document.hidden ? markAway() : setTimeout(tryComplete, 150); });
window.addEventListener('blur', markAway);
window.addEventListener('pagehide', markAway);
window.addEventListener('focus', ()=>setTimeout(tryComplete, 150));
window.addEventListener('pageshow', ()=>setTimeout(tryComplete, 150));

function showOk(){
  if(!S.code){ S.code = String(Math.floor(1000+Math.random()*9000)); save(); }
  $('code').textContent = S.code;
  $('ok').style.display='block';
  if(S.claimed) markClaimed();
  tick(); clearInterval(showOk.i); showOk.i=setInterval(tick,1000);
}
function tick(){
  const d=new Date(); const z=x=>String(x).padStart(2,'0');
  $('clock').textContent = `${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`;
}
function markClaimed(){
  $('ok').classList.add('claimed');
  $('ok').querySelector('h2').textContent='تم استلام العلبة';
  $('ok').querySelector('p').textContent='شكرًا! استمتع بفريتا 😋';
  $('ok').querySelector('.big').textContent='🎁';
  $('hint').textContent='الموبايل ده استلم علبته خلاص';
}
let armT=null;
$('staff').onclick = ()=>{
  const b=$('staff');
  if(!b.classList.contains('arm')){ b.classList.add('arm'); b.textContent='اضغط تاني للتأكيد'; clearTimeout(armT); armT=setTimeout(()=>{b.classList.remove('arm'); b.textContent='للمنظم: تم تسليم العلبة';},3000); return; }
  clearTimeout(armT); S.claimed = true; save(); markClaimed();
};
render();
setTimeout(tryComplete, 300);
</script>
